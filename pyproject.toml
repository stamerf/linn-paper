[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linn-identification"
version = "0.1.0"
description = "Domain-informed process identification from industrial bookings"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "torch>=2.0,<3", "scikit-learn>=1.0,<2", "matplotlib>=3.5,<4", "jinja2>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
